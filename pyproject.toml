[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shotvault"
version = "0.1.0"
description = "Turn your screenshots into a searchable Obsidian knowledge base with local vision models (Ollama / LM Studio)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["obsidian", "screenshots", "ocr", "ollama", "lm-studio", "knowledge-base", "local-llm"]
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10.1",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
# Apple Photos / iCloud library access, Apple Vision OCR and HEIC decoding.
mac = [
  "osxphotos>=0.68; sys_platform == 'darwin'",
  "ocrmac>=1.0; sys_platform == 'darwin'",
  "pillow-heif>=0.16",
]
# Pull screenshots straight from an iPhone over USB.
iphone = ["pymobiledevice3>=11"]
# Expose the vault to LM Studio / Claude Desktop / any MCP client.
mcp = ["mcp>=1.2"]
# OCR fallback for non-Mac machines (needs the `tesseract` binary).
tesseract = ["pytesseract>=0.3.10"]
all = ["shotvault[mac,iphone,mcp]"]
dev = ["pytest>=8"]

[project.scripts]
shotvault = "shotvault.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/shotvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]
